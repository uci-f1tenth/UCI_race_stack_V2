[project]
name = "f1tenth-race-stack"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "racecar_gym",
    "gymnasium>=1.0.0",
    "dreamer",
    "tensorboard>=2.19.0",
    "pre-commit>=4.2.0",
    "torch",
]

[tool.uv.sources]
racecar_gym = { workspace = true }
dreamer = { workspace = true }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv.workspace]
members = ["racecar_gym", "dreamer"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

